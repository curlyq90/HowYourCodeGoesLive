<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How your code goes live — a plain-English tour of Git, GitHub & Vercel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:#FBF9F4;color:#22242B;font-family:'Instrument Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:#3D6FF0;text-decoration:none}
  a:hover{color:#2b57c4}
  ::selection{background:#d8e2ff}
  button{font-family:inherit}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes dashmove{to{stroke-dashoffset:-16}}
  @keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
  @keyframes barfill{from{width:6%}to{width:100%}}
  @keyframes confetti{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(320px) rotate(540deg);opacity:0}}
  @keyframes glowpulse{0%,100%{box-shadow:0 0 0 0 rgba(31,169,113,.35)}50%{box-shadow:0 0 0 10px rgba(31,169,113,0)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";

/* ============================================================
   How your code goes live — interactive prototype
   A faithful, dependency-free port of the Claude Design export
   "Git Workflow Explained.dc.html".
   ============================================================ */

// ---------- static data ----------
const scenes = [
  null,
  { machine: 'computer', title: 'You open a branch',
    plain: "Before touching anything, you spin off a branch — a private, named line of work that starts as an exact copy of the live code. This keeps main (the version users see) pristine while you experiment. It's the very first move when starting any new piece of work.",
    real: "First get current: <span style='font-family:JetBrains Mono;font-size:13px'>git checkout main</span> then <span style='font-family:JetBrains Mono;font-size:13px'>git pull</span> to grab the latest. Then <span style='font-family:JetBrains Mono;font-size:13px'>git checkout -b feature/yahrzeit-emails</span> creates a new branch and switches you onto it. The name is yours — a short description of the work.",

  { machine: 'computer', title: '(Optional) spin up a worktree',

    real: "<span style='font-family:JetBrains Mono;font-size:13px'>git worktree add ../kehilla-hotfix hotfix/login</span> gives you a second working folder on the <span style='font-family:JetBrains Mono;font-size:13px'>hotfix/login</span> branch, side by side with your main folder — same repo, no clashing. Tidy up with <span style='font-family:JetBrains Mono;font-size:13px'>git worktree remove</span> when done.",

    analogy: "editing a photocopy of a document, so the original stays untouched until you're happy with it." },
  { machine: 'computer', title: 'You commit the change',
    plain: "A commit is a labeled save point. You gather up your edits and write a short note describing them. Unlike a normal \"save\", every commit is kept forever — you can always rewind to exactly this moment.",
    real: "<span style='font-family:JetBrains Mono;font-size:13px'>git add</span> stages the files (puts them in the envelope); <span style='font-family:JetBrains Mono;font-size:13px'>git commit -m \"…\"</span> seals it with a message. Each commit gets a unique <b>hash</b> (that short code) so it can always be found again.",
    analogy: "saving a version of a doc titled \"added email feature\" — except you can jump back to any save you've ever made." },
  { machine: 'github', title: 'You push to GitHub',
    plain: "Your commit still only exists on your laptop. Pushing uploads your branch to GitHub — the shared cloud home for your code. Now it's backed up, and other machines (like Vercel) can see it.",
    real: "<span style='font-family:JetBrains Mono;font-size:13px'>git push origin feature/yahrzeit-emails</span>. <b>origin</b> is just a nickname for \"GitHub, the remote copy\". Your local branch now has a twin living in the cloud.",
    analogy: "dropping your sealed envelope at the post office's sorting center — safely stored, and ready to be routed onward." },
  { machine: 'github', title: 'You open a Pull Request',

    real: "You're asking to merge your <b>compare branch</b> (the feature) into the <b>base branch</b> (<span style='font-family:JetBrains Mono;font-size:13px'>main</span>). Even solo it's worth doing: a PR is what kicks off the checks and gives you a preview before anything reaches real users.",

  { machine: 'github', title: 'Automatic checks run',
    plain: "The instant your PR exists, robots inspect your code — no button to press. If any fail, you find out here, long before a single user is affected. Give it a go:",

  { machine: 'vercel', title: 'Vercel builds a preview',
    plain: "This is the part you never see from inside Claude Code. The moment your PR opens, Vercel quietly builds a private, fully-working copy of your app — with your changes — at its own temporary web address. You can click around the real thing before the public does.",
    real: "This is a <b>Preview Deployment</b>. Every PR gets one at a <span style='font-family:JetBrains Mono;font-size:13px'>*.vercel.app</span> URL, using the <b>Preview</b> environment variables. Your live users never see it.",
    analogy: "a working showroom model of your product — open only to you — before it ever hits the shelves." },
  { machine: 'github', title: 'You merge to main',
    plain: "Checks green and preview looking good? Merging folds your branch into main — the official, single source of truth for your app. This is the decision that says \"yes, ship this.\"",

    analogy: "your approved photocopy edits finally being copied back onto the master document everyone works from." },
  { machine: 'vercel', title: 'It goes live automatically',
    plain: "The instant main changes, Vercel notices and — with no action from you — rebuilds and publishes it to your real domain. Your feature is now live for every member. That's the whole loop.",
    real: "This is the <b>Production Deployment</b>, triggered by the merge to <span style='font-family:JetBrains Mono;font-size:13px'>main</span>. It uses <b>Production</b> env vars and serves your live site + tenant subdomains. ⚠️ If your change needed a manual SQL migration, run it now — nothing does that for you.",
    analogy: "the delivery truck taking the approved master copy and shipping it to every store at once." },

const termData = [
  ['repo', "Short for repository — the project folder that Git is tracking, including its entire history of changes."],
  ['branch', "A safe parallel copy of the code where you make changes without touching the live version. You work on branches, then merge them in."],
  ['commit', "A permanent, labeled save point. A snapshot of your files plus a short message describing what changed."],
  ['hash', "The unique ID of a commit (a short code like a1b2c3d). Lets you point to one exact moment in history."],
  ['push', "Uploading your commits from your laptop up to GitHub, so they're backed up and shareable."],
  ['pull', "The opposite of push — downloading the latest commits from GitHub onto your laptop."],
  ['origin', "The default nickname for \"GitHub\" — the remote, cloud copy of your repo."],
  ['main', "The primary branch — the official, source-of-truth version of your app. Merging into main is what goes live."],
  ['pull request', "A PR: a proposal to merge one branch into another, with a review page. Opening it triggers checks and a preview."],
  ['merge', "Combining the changes from one branch into another — e.g. folding your feature into main."],
  ['merge conflict', "When two edits change the same lines and Git can't decide which to keep. You choose the right version, then commit."],
  ['CI', "Continuous Integration — automatic checks (lint, tests, build) that run on every PR to catch problems early."],
  ['GitHub Actions', "GitHub's built-in robot that runs your CI checks automatically whenever code changes."],
  ['deploy', "Publishing your code so it actually runs on a server people can reach — done here by Vercel."],
  ['preview deployment', "A private, live copy of your app for a single PR, at a temporary *.vercel.app URL. For testing before it's public."],
  ['production', "The real, public version of your app that live users see — your actual domain."],
  ['environment variable', "A secret setting (API key, database URL) stored on the machine, not in your code. Must be set on Vercel separately from your laptop."],
  ['rollback', "Instantly reverting your live site to a previous good deploy when something breaks."],
];

const machineMeta = {
  computer: { name: 'Your computer', icon: '💻', color: '#3D6FF0', tint: '#EEF3FF', border: '#dbe6ff' },
  github:   { name: 'GitHub',        icon: '📦', color: '#1FA971', tint: '#E9F7F0', border: '#cdeede' },
  vercel:   { name: 'Vercel',        icon: '🚀', color: '#7C5CFC', tint: '#F1EDFE', border: '#e0d6fb' },
};

// Production domain — the one editable "prop" in the original design.
const PROD_URL = 'kehillahq.com';

// ---------- state ----------
const state = {
  view: 'intro',       // 'intro' | 'journey' | 'trouble' | 'jargon'
  step: 1,             // 1..10
  committed: false,
  prOpen: false,
  ciRunning: false,
  ciAllPass: false,
  checks: [
    { name: 'Lint',      desc: 'Checks code style & formatting',          status: 'pending' },
    { name: 'Typecheck', desc: 'Catches type mistakes before they run',   status: 'pending' },
    { name: 'Test',      desc: 'Runs the automated test suite',           status: 'pending' },
    { name: 'Build',     desc: 'Confirms the app compiles & bundles',     status: 'pending' },
  ],
  preview: 'idle',     // 'idle' | 'building' | 'ready'
  merged: false,
  prod: 'idle',        // 'idle' | 'building' | 'live'
  live: false,
  selected: 'pull request',
};

// setState-like helper: accepts an object patch OR a function returning a patch.
function setState(patch) {
  const p = typeof patch === 'function' ? patch(state) : patch;
  Object.assign(state, p);
  render();
}

// ---------- actions ----------
const actions = {};   // registry: data-act name -> handler

function goStep(n) { setState({ view: 'journey', step: n }); window.scrollTo({ top: 0 }); }
function nextStep() { if (state.step < 10) goStep(state.step + 1); }
function prevStep() { if (state.step > 1) goStep(state.step - 1); }

function runChecks() {
  if (state.ciRunning || state.ciAllPass) return;
  setState({ ciRunning: true });
  [0, 1, 2, 3].forEach((i, idx) => {
    setTimeout(() => setState(s => { const c = s.checks.map(x => ({ ...x })); c[i].status = 'running'; return { checks: c }; }), idx * 1200 + 300);
    setTimeout(() => setState(s => {
      const c = s.checks.map(x => ({ ...x })); c[i].status = 'pass';
      const all = c.every(x => x.status === 'pass');
      return { checks: c, ciAllPass: all, ciRunning: !all };
    }), idx * 1200 + 1200);
  });
}

function deployPreview() {
  if (state.preview !== 'idle') return;
  setState({ preview: 'building' });
  setTimeout(() => setState({ preview: 'ready' }), 2600);
}

function shipLive() {
  if (state.prod !== 'idle') return;
  setState({ prod: 'building' });
  setTimeout(() => setState({ prod: 'live', live: true }), 2600);
}

// ---------- small helpers ----------
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

function tabStyle(active) {
  return active
    ? "background:#fff;color:#22242B;border:none;border-radius:9px;padding:8px 15px;font-family:'Instrument Sans';font-weight:600;font-size:13.5px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08)"
    : "background:none;color:#8A8E99;border:none;border-radius:9px;padding:8px 15px;font-family:'Instrument Sans';font-weight:600;font-size:13.5px;cursor:pointer";
}

// register an action, return the attribute string to drop on an element
let _actId = 0;
function act(fn, hover) {
  const id = 'a' + (_actId++);
  actions[id] = fn;
  let s = ` data-act="${id}"`;
  if (hover) s += ` data-hover="${esc(hover)}"`;
  return s;
}

// ---------- view: HEADER ----------
function headerHtml() {

    <div style="display:flex;align-items:center;gap:11px;cursor:pointer"${act(() => setState({ view: 'intro' }))}>
      <div style="width:34px;height:34px;border-radius:10px;background:#3D6FF0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-family:'Bricolage Grotesque';font-size:18px">g</div>
      <div>
        <div style="font-family:'Bricolage Grotesque';font-weight:700;font-size:16px;line-height:1">How your code goes live</div>

}

// ---------- view: JOURNEY ----------
function railHtml() {
  const step = state.step;
  const railLabels = ['Branch', 'Worktree', 'Edit', 'Commit', 'Push', 'Pull Request', 'Checks', 'Preview', 'Merge', 'Live'];
  return railLabels.map((label, i) => {
    const n = i + 1;
    const done = n < step, current = n === step;
    const bg = current ? '#3D6FF0' : done ? '#1FA971' : '#F1EDE3';
    const fg = (current || done) ? '#fff' : '#9a9ea8';
    const ring = current ? '#3D6FF0' : done ? '#1FA971' : '#E7E2D6';
    const labelColor = current ? '#22242B' : done ? '#166a49' : '#B0B4BE';
    const hasLine = n < 10;
    const lineColor = n < step ? '#1FA971' : '#E7E2D6';
    const inner = done ? '<span>✓</span>' : `<span>${n}</span>`;
    const line = hasLine ? `<div style="width:26px;height:2px;background:${lineColor};margin:0 -1px 18px;flex-shrink:0"></div>` : '';
    return `
      <div style="display:flex;align-items:center;flex-shrink:0">
        <button${act(() => goStep(n))} title="${esc(label)}" style="display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;cursor:pointer;padding:2px 4px;min-width:78px">
          <div style="width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono';font-weight:600;font-size:14px;background:${bg};color:${fg};border:2px solid ${ring};transition:all .2s">${inner}</div>
          <span style="font-size:11.5px;font-weight:600;color:${labelColor};white-space:nowrap">${esc(label)}</span>
        </button>
        ${line}
      </div>`;
  }).join('');
}

function currentAction() {
  const st = state, step = st.step;
  if (step === 4 && !st.committed) return { label: '✉️ Seal the commit', fn: () => setState({ committed: true }), color: '#3D6FF0' };
  if (step === 6 && !st.prOpen) return { label: '📮 Open the pull request', fn: () => setState({ prOpen: true }), color: '#1FA971' };
  if (step === 7 && !st.ciAllPass) return { label: st.ciRunning ? '⏳ Running…' : '▶ Run the checks', fn: () => runChecks(), color: st.ciRunning ? '#c9a94e' : '#1FA971' };
  if (step === 8 && st.preview !== 'ready') return { label: st.preview === 'building' ? '⏳ Building…' : '🚀 Deploy the preview', fn: () => deployPreview(), color: st.preview === 'building' ? '#a78ef0' : '#7C5CFC' };
  if (step === 9 && !st.merged) return { label: '🔀 Merge to main', fn: () => setState({ merged: true }), color: '#1FA971' };
  if (step === 10 && !st.live) return { label: st.prod === 'building' ? '⏳ Deploying…' : '🚀 Ship it live', fn: () => shipLive(), color: st.prod === 'building' ? '#a78ef0' : '#7C5CFC' };
  return null;
}

          </div>

          <div style="margin-top:14px;background:#FBF7EE;border:1px solid #F0E4CC;border-radius:14px;padding:14px 16px;display:flex;gap:11px;align-items:flex-start">
            <span style="font-size:17px">💡</span>
            <p style="margin:0;font-size:14px;line-height:1.55;color:#6b5a34"><b style="color:#4d4223">Think of it like:</b> ${esc(sc.analogy)}</p>
          </div>

          ${actionBtn}
        </div>
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:34px;padding-top:22px;border-top:1px solid #ECE7DC">
        <button${act(() => prevStep(), 'filter:brightness(.97)')} style="${prevStyle}">← Back</button>
        <div style="font-family:'JetBrains Mono';font-size:12.5px;color:#B0B4BE">${step} / 10</div>
        ${nextArea}
      </div>
    </div>
  </div>`;
}

// ---------- view: TROUBLE ----------
function troubleHtml() {
  return `
  <div style="flex:1;padding:44px 26px 80px;max-width:1000px;margin:0 auto;width:100%">
    <div style="display:inline-block;font-family:'JetBrains Mono';font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#F26D5B;background:#FDEEEA;border:1px solid #f7d8d0;padding:6px 12px;border-radius:999px">Survival guide</div>
    <h1 style="font-family:'Bricolage Grotesque';font-weight:800;font-size:40px;letter-spacing:-.02em;margin:16px 0 6px">When things break</h1>
    <p style="font-size:17px;color:#565A66;max-width:60ch;margin:0 0 30px">The four hiccups you'll actually hit — and the calm, boring fix for each.</p>

    <div style="display:grid;gap:16px">
      <div style="background:#fff;border:1px solid #ECE7DC;border-radius:16px;padding:22px 24px">
        <div style="display:flex;align-items:center;gap:11px"><span style="font-size:22px">🔴</span><h3 style="font-family:'Bricolage Grotesque';font-weight:700;font-size:20px;margin:0">A check failed (red ✗ on your PR)</h3></div>
        <p style="font-size:14.5px;line-height:1.6;color:#4a4d57;margin:12px 0 0">Nothing is live and nothing is broken — the safety inspection just caught something. Click the red check to read the log, tell Claude Code what it said, fix it, then <span style="font-family:'JetBrains Mono';font-size:13px;background:#F1EDE3;padding:1px 6px;border-radius:5px">commit &amp; push</span> again. Your PR updates itself and re-runs the checks automatically.</p>
      </div>

      <div style="background:#fff;border:1px solid #ECE7DC;border-radius:16px;padding:22px 24px">
        <div style="display:flex;align-items:center;gap:11px"><span style="font-size:22px">⚙️</span><h3 style="font-family:'Bricolage Grotesque';font-weight:700;font-size:20px;margin:0">"It works locally but breaks on Vercel"</h3></div>
        <p style="font-size:14.5px;line-height:1.6;color:#4a4d57;margin:12px 0 0">The #1 gotcha. Almost always a missing <b>environment variable</b> — a secret setting (API keys, database URL) that lives on the machine, not in your code. Your laptop has it in <span style="font-family:'JetBrains Mono';font-size:13px;background:#F1EDE3;padding:1px 6px;border-radius:5px">.env</span>; Vercel doesn't unless you add it.</p>
        <div style="margin-top:12px;background:#FBF7EE;border:1px solid #F0E4CC;border-radius:10px;padding:12px 14px;font-size:13.5px;color:#6b5a34;line-height:1.55"><b>Fix:</b> add any new env var in <b>both</b> places — Vercel → Settings → Environment Variables for <b>Preview</b> AND <b>Production</b>. Keep <span style="font-family:'JetBrains Mono';font-size:12.5px">.env.example</span> updated so you don't forget.</div>
      </div>

      <div style="background:#fff;border:1px solid #ECE7DC;border-radius:16px;padding:22px 24px">
        <div style="display:flex;align-items:center;gap:11px"><span style="font-size:22px">🔀</span><h3 style="font-family:'Bricolage Grotesque';font-weight:700;font-size:20px;margin:0">"Merge conflict"</h3></div>
        <p style="font-size:14.5px;line-height:1.6;color:#4a4d57;margin:12px 0 0">Two different edits touched the <i>same lines</i>, and Git honestly can't guess which one you want. It doesn't lose anything — it just pauses and asks you to choose. Open the flagged file, keep the correct version (Claude Code is great at this), then commit. As a solo founder this is rare, but merging <span style="font-family:'JetBrains Mono';font-size:13px;background:#F1EDE3;padding:1px 6px;border-radius:5px">main</span> into your branch often keeps it small.</p>
      </div>

      <div style="background:#fff;border:1px solid #ECE7DC;border-radius:16px;padding:22px 24px">
        <div style="display:flex;align-items:center;gap:11px"><span style="font-size:22px">⏪</span><h3 style="font-family:'Bricolage Grotesque';font-weight:700;font-size:20px;margin:0">A bad deploy went live</h3></div>
        <p style="font-size:14.5px;line-height:1.6;color:#4a4d57;margin:12px 0 0">Stay calm — you can undo it in seconds. Every past deploy is kept. In <b>Vercel → Deployments</b>, pick the last one that worked and click <b>Promote to Production</b> (<span style="font-family:'JetBrains Mono';font-size:13px;background:#F1EDE3;padding:1px 6px;border-radius:5px">vercel rollback</span> from the terminal does the same). Your site is instantly back to the good version while you fix the real issue on a branch.</p>
      </div>

      <div style="background:#FDF3F1;border:1px solid #f7d8d0;border-radius:16px;padding:22px 24px">
        <div style="display:flex;align-items:center;gap:11px"><span style="font-size:22px">🗄️</span><h3 style="font-family:'Bricolage Grotesque';font-weight:700;font-size:20px;margin:0;color:#b34b3b">The one only YOU can do: manual database migrations</h3></div>
        <p style="font-size:14.5px;line-height:1.6;color:#7a4034;margin:12px 0 0">Some database changes in Kehilla live as hand-run SQL in <span style="font-family:'JetBrains Mono';font-size:13px;background:#f7ded8;padding:1px 6px;border-radius:5px">prisma/migrations/manual/</span>. <b>Nothing runs these automatically</b> — not GitHub, not Vercel. If a change needs one, run it against production yourself around merge time, or the live site will error even though every check was green. This has bitten the project before.</p>
      </div>
    </div>

    <button${act(() => { setState({ view: 'jargon' }); window.scrollTo({ top: 0 }); }, 'filter:brightness(1.15)')} style="margin-top:30px;background:#22242B;color:#fff;border:none;border-radius:12px;padding:14px 24px;font-family:'Bricolage Grotesque';font-weight:700;font-size:15px;cursor:pointer">Look up the jargon →</button>
  </div>`;
}

// ---------- view: JARGON ----------
function jargonHtml() {
  const st = state;
  const chips = termData.map(([term]) => {
    const active = st.selected === term;
    const bg = active ? '#7C5CFC' : '#fff';
    const fg = active ? '#fff' : '#4a4d57';
    const border = active ? '#7C5CFC' : '#E7E2D6';
    return `<button${act(() => setState({ selected: term }), 'filter:brightness(.98)')} style="font-family:'JetBrains Mono';font-size:13.5px;font-weight:500;padding:9px 15px;border-radius:10px;cursor:pointer;background:${bg};color:${fg};border:1.5px solid ${border}">${esc(term)}</button>`;
  }).join('');
  const selEntry = termData.find(t => t[0] === st.selected) || termData[8];
  return `
  <div style="flex:1;padding:44px 26px 80px;max-width:1000px;margin:0 auto;width:100%">
    <div style="display:inline-block;font-family:'JetBrains Mono';font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#7C5CFC;background:#F1EDFE;border:1px solid #e0d6fb;padding:6px 12px;border-radius:999px">Speak the language</div>
    <h1 style="font-family:'Bricolage Grotesque';font-weight:800;font-size:40px;letter-spacing:-.02em;margin:16px 0 6px">Jargon buster</h1>
    <p style="font-size:17px;color:#565A66;max-width:60ch;margin:0 0 26px">Tap any term for a one-line, no-nonsense definition.</p>

    <div style="display:flex;flex-wrap:wrap;gap:10px">
      ${chips}
    </div>

    <div style="margin-top:24px;background:#fff;border:1px solid #ECE7DC;border-radius:16px;padding:26px 28px;min-height:120px">
      <div style="font-family:'Bricolage Grotesque';font-weight:700;font-size:24px;color:#7C5CFC">${esc(selEntry[0])}</div>
      <p style="font-size:16px;line-height:1.6;color:#3a3d47;margin:12px 0 0">${esc(selEntry[1])}</p>
    </div>
  </div>`;
}

// ---------- render ----------
function render() {
  // reset action registry each render (handlers are re-created on each render)
  for (const k in actions) delete actions[k];
  _actId = 0;

  let body = '';
  if (state.view === 'intro') body = introHtml();
  else if (state.view === 'journey') body = journeyHtml();
  else if (state.view === 'trouble') body = troubleHtml();
  else if (state.view === 'jargon') body = jargonHtml();

  document.getElementById('app').innerHTML =
    `<div style="min-height:100vh;display:flex;flex-direction:column">${headerHtml()}${body}</div>`;

  wireHover();
}

// hover effects (mirrors the design's style-hover attribute)
function wireHover() {
  document.querySelectorAll('[data-hover]').forEach(el => {
    const hover = el.getAttribute('data-hover');
    const base = el.getAttribute('style') || '';
    el.addEventListener('mouseenter', () => { el.setAttribute('style', base + ';' + hover); });
    el.addEventListener('mouseleave', () => { el.setAttribute('style', base); });
  });
}

// delegated click dispatch
document.getElementById('app').addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const fn = actions[t.getAttribute('data-act')];
  if (fn) fn();
});

render();
</script>
